<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        .greeting{
            text-align: center;
        }
        .content{
            background-color: grey;
            border-radius: 16px;
            text-align: center;
        }
        #credentials{
            font-size: 17px;
            border-radius: 6px;
            border-width: 1px;
            color: blue;
            background-color: orangered;
            transition: 1s;
        }
        #credentials:hover{
            color: orangered;
            background-color: blue;
        }
        .login{
            color: blue;
            background-color: orangered;
            transition: 2s;
            border-radius: 6px;
            border-width: 1px;
            font-size: 14px;
        }
        .login:hover{
            color: orangered;
            background-color: blue;
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diary of a Wimpy Kid Community Login</title>
</head>
<body bgcolor="blue">
    <div class="content">
    <h1 class="greeting">Login to <br>
        Diary of a Wimpy Kid <br>Community</h1>
        <br>
        <br>
        <input id="credentials" type="text" placeholder="Username/optional">
        <br>
        <br>
        <input id="credentials" type="email" placeholder="Email">
        <br>
        <br>
        <input id="credentials" type="password" placeholder="Password"
    </div>
    <br>
    <br>
    <button onclick="window.location.href='';" class="login">Login</button>
